[platformio]
default_envs = feather_m0_lora_node


; ============================================================
; Shared project-wide settings
; ============================================================

[common]
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Iinclude

native_build_flags =
  ${common.build_flags}
  -DUNIT_TEST
  -DSMARTFIRES_NATIVE_TEST=1
  -Itest/support

feather_build_flags =
  ${common.build_flags}
  -DSMARTFIRES_TARGET_FEATHER_M0=1
  -Wl,-u,_printf_float
  -I$PROJECT_PACKAGES_DIR/framework-arduino-samd-adafruit/libraries/SPI
  -I$PROJECT_PACKAGES_DIR/framework-arduino-samd-adafruit/libraries/Adafruit_ZeroDMA


; ============================================================
; Shared Feather M0 target settings
; ============================================================

[feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+


; ============================================================
; Full firmware dependencies
; ============================================================

[libs_full]
lib_deps =
  SPI
  adafruit/Adafruit BusIO
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit Unified Sensor
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library
  adafruit/Adafruit GPS Library
  sensirion/Sensirion UART SPS30
  mikem/RadioHead@1.120.0


; ============================================================
; Dummy node dependencies
; ============================================================

[libs_dummy]
lib_deps =
  SPI
  adafruit/Adafruit BusIO
  mikem/RadioHead@1.120.0


; ============================================================
; Normal firmware source tree
;
; src/main.cpp selects the role using:
;   -DLORA_BASE=1
;   -DLORA_NODE=1
; ============================================================

[src_firmware]
build_src_filter =
  +<app/>
  +<platform/>
  +<power/>
  +<radio/>
  +<sensors/>
  +<telemetry/>
  +<main.cpp>
  -<main_base.cpp>
  -<main_node.cpp>
  -<main_node_dummy.cpp>


; ============================================================
; Dummy node source tree
;
; Uses src/main_node_dummy.cpp instead of src/main.cpp.
; ============================================================

[src_dummy_node]
build_src_filter =
  +<app/>
  +<platform/ArduinoAnalogReader.cpp>
  +<platform/ArduinoClock.cpp>
  +<platform/RadioHeadTdmaDriver.cpp>
  +<power/>
  +<radio/>
  +<sensors/>
  +<telemetry/>
  +<main_node_dummy.cpp>
  -<main.cpp>
  -<main_base.cpp>
  -<main_node.cpp>


; ============================================================
; Native unit tests
;
; Runs on laptop/desktop without Arduino hardware.
; ============================================================

[env:native]
platform = native
test_framework = unity
test_build_src = yes

build_flags =
  ${common.native_build_flags}

build_src_filter =
  +<power/>
  +<sensors/>
  -<main.cpp>
  -<main_base.cpp>
  -<main_node.cpp>
  -<main_node_dummy.cpp>


; ============================================================
; LoRa base station / edge unit
;
; This is the Feather M0 connected to the Jetson.
; It receives LoRa packets and forwards decoded frames over Serial1.
; ============================================================

[env:feather_m0_lora_base]
platform = ${feather_m0.platform}
board = ${feather_m0.board}
framework = ${feather_m0.framework}
monitor_speed = ${feather_m0.monitor_speed}
lib_ldf_mode = ${feather_m0.lib_ldf_mode}

upload_port = /dev/cu.usbmodem1301
monitor_port = /dev/cu.usbmodem1301

build_src_filter =
  ${src_firmware.build_src_filter}

build_flags =
  ${common.feather_build_flags}
  -DLORA_BASE=1

lib_deps =
  ${libs_full.lib_deps}


; ============================================================
; Real LoRa sensor node
;
; NODE_ID is intentionally not defined here.
; The firmware should derive board identity from the SAMD21 unique ID.
; ============================================================

[env:feather_m0_lora_node]
platform = ${feather_m0.platform}
board = ${feather_m0.board}
framework = ${feather_m0.framework}
monitor_speed = ${feather_m0.monitor_speed}
lib_ldf_mode = ${feather_m0.lib_ldf_mode}

upload_port = /dev/cu.usbmodem11401
monitor_port = /dev/cu.usbmodem11401

build_src_filter =
  ${src_firmware.build_src_filter}

build_flags =
  ${common.feather_build_flags}
  -DLORA_NODE=1
  -DNUM_SLOTS=4
  -DSMARTFIRES_TDMA_RELIABILITY_MODE=1
  -DSMARTFIRES_STATUS_INTERVAL_MS=10000

lib_deps =
  ${libs_full.lib_deps}


; ============================================================
; Dummy LoRa sensor node
;
; Synthetic sensor data only.
; Useful for testing:
;   dummy Feather node -> LoRa base/edge unit -> Jetson UART
;
; This keeps NODE_ID because dummy nodes are test fixtures.
; ============================================================

[env:feather_m0_lora_node_dummy]
platform = ${feather_m0.platform}
board = ${feather_m0.board}
framework = ${feather_m0.framework}
monitor_speed = ${feather_m0.monitor_speed}
lib_ldf_mode = ${feather_m0.lib_ldf_mode}

upload_port = /dev/cu.usbmodem1301
monitor_port = /dev/cu.usbmodem1301

build_src_filter =
  ${src_dummy_node.build_src_filter}

build_flags =
  ${common.feather_build_flags}
  -DLORA_NODE=1
  -DSMARTFIRES_DUMMY_NODE=1
  -DNODE_ID=2
  -DNUM_SLOTS=4
  -DSMARTFIRES_TDMA_RELIABILITY_MODE=1

lib_deps =
  ${libs_dummy.lib_deps}

; ============================================================
; Passive LoRa sniffer
;
; Flash this onto a spare Feather M0 RFM95.
; It listens on the same LoRa channel and prints packet metadata.
; It does not participate in TDMA.
; ============================================================

[env:feather_m0_lora_sniffer]
platform = ${feather_m0.platform}
board = ${feather_m0.board}
framework = ${feather_m0.framework}
monitor_speed = ${feather_m0.monitor_speed}
lib_ldf_mode = ${feather_m0.lib_ldf_mode}

build_src_filter =
  +<main_lora_sniffer.cpp>
  -<main.cpp>
  -<main_base.cpp>
  -<main_node.cpp>
  -<main_node_dummy.cpp>

build_flags =
  ${common.feather_build_flags}
  -DSMARTFIRES_LORA_SNIFFER=1

lib_deps =
  SPI
  mikem/RadioHead@1.120.0
