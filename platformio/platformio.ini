[platformio]
default_envs = feather_m0_lora_node_debug
monitor_dir = monitor

; ============================================================
; Shared project-wide settings
; ============================================================

[common]
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Iinclude

native_build_flags =
  ${common.build_flags}
  -DUNIT_TEST
  -DSMARTFIRES_NATIVE_TEST=1
  -Itest/support

feather_build_flags =
  ${common.build_flags}
  -DSMARTFIRES_TARGET_FEATHER_M0=1
  -Wl,-u,_printf_float
  -I$PROJECT_PACKAGES_DIR/framework-arduino-samd-adafruit/libraries/SPI
  -I$PROJECT_PACKAGES_DIR/framework-arduino-samd-adafruit/libraries/Adafruit_ZeroDMA


; ============================================================
; Shared Feather M0 target settings
; ============================================================

[feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+


; ============================================================
; Full firmware dependencies
; ============================================================

[libs_full]
lib_deps =
  SPI
  adafruit/Adafruit BusIO
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit Unified Sensor
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library
  adafruit/Adafruit GPS Library
  sensirion/Sensirion UART SPS30
  mikem/RadioHead@1.120.0
  adafruit/Adafruit SleepyDog Library


; ============================================================
; Normal firmware source tree
;
; src/main.cpp selects the role using:
;   -DLORA_BASE=1
;   -DLORA_NODE=1
; ============================================================

[src_firmware]
build_src_filter =
  +<app/>
  +<calibration/>
  +<platform/>
  +<power/>
  +<radio/>
  +<sensors/>
  +<telemetry/>
  +<main.cpp>
  -<main_base.cpp>
  -<main_node.cpp>


; ============================================================
; Native unit tests
;
; Runs on laptop/desktop without Arduino hardware.
; ============================================================

[env:native]
platform = native
test_framework = unity
test_build_src = yes

build_flags =
  ${common.native_build_flags}

build_src_filter =
  +<power/>
  +<sensors/>
  +<radio/TdmaClock.cpp>
  +<radio/PacketHandler.cpp>
  -<main.cpp>
  -<main_base.cpp>
  -<main_node.cpp>


; ============================================================
; LoRa base station / edge unit
;
; This is the Feather M0 connected to the Jetson.
; It receives LoRa packets and forwards decoded frames over Serial1.
; ============================================================

[env:feather_m0_lora_base]
platform = ${feather_m0.platform}
board = ${feather_m0.board}
framework = ${feather_m0.framework}
monitor_speed = ${feather_m0.monitor_speed}
lib_ldf_mode = ${feather_m0.lib_ldf_mode}


build_src_filter =
  ${src_firmware.build_src_filter}

build_flags =
  ${common.feather_build_flags}
  -DLORA_BASE=1

lib_deps =
  ${libs_full.lib_deps}


; ============================================================
; Real LoRa sensor node
;
; NODE_ID is intentionally not defined here.
; The firmware should derive board identity from the SAMD21 unique ID.
; ============================================================

[env:feather_m0_lora_node]
platform = ${feather_m0.platform}
board = ${feather_m0.board}
framework = ${feather_m0.framework}
monitor_speed = ${feather_m0.monitor_speed}
lib_ldf_mode = ${feather_m0.lib_ldf_mode}


build_src_filter =
  ${src_firmware.build_src_filter}

build_flags =
  ${common.feather_build_flags}
  -DLORA_NODE=2
  -DNUM_SLOTS=4
  -DSMARTFIRES_TDMA_RELIABILITY_MODE=1
  -DSMARTFIRES_STATUS_INTERVAL_MS=15000
  -DSMARTFIRES_DUTY_CYCLE_CONTINUOUS=0
  -DICM_20948_USE_DMP

lib_deps =
  ${libs_full.lib_deps}

; ============================================================
; Debug loRa sensor node
;
; This will run a custom filter script for debug output
; Runs at a lower sample rate.
; 
; Automatically logs file to the data directory
; ============================================================

[env:feather_m0_lora_node_debug]
platform = ${feather_m0.platform}
board = ${feather_m0.board}
framework = ${feather_m0.framework}
monitor_speed = ${feather_m0.monitor_speed}
lib_ldf_mode = ${feather_m0.lib_ldf_mode}

build_src_filter =
  ${src_firmware.build_src_filter}

build_flags =
  ${common.feather_build_flags}
  ; ${node_debug.build_flags}
  -DLORA_NODE=1
  -DNUM_SLOTS=4
  -DSMARTFIRES_TDMA_RELIABILITY_MODE=1
  -DSMARTFIRES_STATUS_INTERVAL_MS=15000
  -DSMARTFIRES_DUTY_CYCLE_CONTINUOUS=1
  -DICM_20948_USE_DMP

monitor_filters =
  smartfires_debug
  log2file

lib_deps =
  ${libs_full.lib_deps}

; ============================================================
; Power test firmware
;
; No LoRa app, no TDMA, no packet layer.
; Used for measuring Feather board, radio, MCU sleep, and sensor power.
;
; POWER_TEST_MODE values:
;   1  = MCU running, radio sleeping, sensors off
;   2  = MCU standby forever, radio sleeping, sensors off
;   3  = I2C initialized only
;   4  = radio standby
;   5  = radio RX continuous
;   10 = SHT31 only
;   11 = ICM20948 IMU only
;   12 = GPS only
;   13 = SPS30 only
;   14 = Wind sensor only
; ============================================================

[power_test_common]
build_src_filter =
  +<main.cpp>

  +<platform/ArduinoAnalogReader.cpp>
  +<platform/ArduinoClock.cpp>
  +<platform/AdafruitGpsDriver.cpp>
  +<platform/AdafruitSht31Driver.cpp>
  +<platform/SensirionUartSps30Driver.cpp>
  +<platform/SparkfunIcm20948Driver.cpp>
  +<platform/TPSDriver.cpp>

  +<power/BatteryMonitor.cpp>

  +<sensors/Icm20948Sensor.cpp>
  +<sensors/Pa1010dGpsSensor.cpp>
  +<sensors/Sht31Sensor.cpp>
  +<sensors/Sps30Sensor.cpp>
  +<sensors/WindSensorRevC.cpp>

  +<telemetry/>

  -<app/>
  -<radio/>
  -<calibration/>
  -<platform/RadioHeadTdmaDriver.cpp>
  -<main_base.cpp>
  -<main_node.cpp>
  -<main_lora_sniffer.cpp>

build_flags =
  ${common.feather_build_flags}
  -DPOWER_TEST=1
  -DICM_20948_USE_DMP
  -DPOWER_TEST_USE_SERIAL=1
  -DPOWER_TEST_SAMPLE_PERIOD_MS=1000
  -DPOWER_TEST_PRE_SLEEP_DELAY_MS=5000

monitor_filters =
  smartfires_debug
  log2file

lib_deps =
  SPI
  adafruit/Adafruit BusIO
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit Unified Sensor
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library
  adafruit/Adafruit GPS Library
  sensirion/Sensirion UART SPS30


[env:feather_m0_power_mcu_run]
platform = ${feather_m0.platform}
board = ${feather_m0.board}
framework = ${feather_m0.framework}
monitor_speed = ${feather_m0.monitor_speed}
lib_ldf_mode = ${feather_m0.lib_ldf_mode}
build_src_filter = ${power_test_common.build_src_filter}
build_flags =
