[platformio]
default_envs = native

[env]
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Iinclude

[env:native]
platform = native
test_framework = unity
build_flags =
  ${env.build_flags}
  -DUNIT_TEST
  -DSMARTFIRES_NATIVE_TEST=1

test_build_src = yes

lib_deps =
    throwtheswitch/Unity

build_src_filter =
  +<app/>
  +<power/>
  +<sensors/>
  +<telemetry/>
  +<radio/>
  -<main.cpp>

[env:feather_m0_lora]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200

build_flags =
  ${env.build_flags}
  ; -DSMARTFIRES_TARGET_FEATHER_M0=1
  ; -DSMARTFIRES_HAS_OLED=0
  ; -DSMARTFIRES_HAS_KEYPAD=0
  ; -DSMARTFIRES_HAS_SHT31=1
  ; -DSMARTFIRES_HAS_GPS=1
  ; -DSMARTFIRES_HAS_SPS30=1
  ; -DSMARTFIRES_HAS_IMU=1
  ; -DSMARTFIRES_HAS_WIND=1
  ; -DSMARTFIRES_HAS_BATTERY=1
  ; -DSMARTFIRES_HAS_LORA=0

lib_ldf_mode = deep+

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit Unified Sensor
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library
  adafruit/Adafruit GPS Library
  sensirion/Sensirion UART SPS30

[env:feather_m0_lora_node]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200

build_flags =
  ${env.build_flags}
  -DSMARTFIRES_TARGET_FEATHER_M0=1
  -DLORA_NODE=1
  -DNODE_ID=1
  -DNUM_SLOTS=2

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit Unified Sensor
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library
  adafruit/Adafruit GPS Library
  sensirion/Sensirion UART SPS30
  mikem/RadioHead@1.120.0
