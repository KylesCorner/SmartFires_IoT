; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; SmartFires unified PlatformIO configuration
; SmartFires unified PlatformIO configuration

[platformio]
default_envs = drone
description = Unified SmartFires project for Drone and LoRa targets

[env]
framework = arduino

; =========================================================
; Base environment: ESP32 / Arduino Nano ESP32
; =========================================================
[env:esp32_base]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
upload_speed = 115200
monitor_speed = 115200

lib_deps =
  SPI
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit Unified Sensor
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library
  arduino-libraries/Servo
  adafruit/Adafruit GPS Library
  olikraus/U8g2
  chris--a/Keypad

build_src_filter =
  +<shared/>
  -<drone/>
  -<drone_lora_bridge/>
  -<lora_feather/>
  -<uno/>

test_framework = unity
test_build_src = yes
test_speed = 115200

; =========================================================
; Base environment: Feather M0 LoRa board
; =========================================================
[env:feather_m0_base]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200

lib_deps =
  RadioHead
  SPI

build_src_filter =
  +<shared/>
  -<drone/>
  -<drone_lora_bridge/>
  -<lora_feather/>
  -<uno/>

; test_framework = unity
; test_build_src = yes
; test_speed = 115200

; =========================================================
; Main drone firmware (ESP32)
; =========================================================
[env:drone]
extends = env:esp32_base

build_flags =
  -D TARGET_DRONE=1
  -D NODE_ID=1

build_src_filter =
  ${env:esp32_base.build_src_filter}
  +<drone/>

; =========================================================
; Drone firmware — node 2 ESP32
; =========================================================
[env:drone_node2]
extends = env:esp32_base

build_flags =
  -D TARGET_DRONE=1
  -D NODE_ID=2

build_src_filter =
  ${env:esp32_base.build_src_filter}
  +<drone/>

; =========================================================
; ESP32 <-> Feather UART bridge / telemetry firmware
; =========================================================
; [env:drone_lora_bridge]
; extends = env:esp32_base
;
; lib_deps =
;   SPI
;
; build_flags =
;   -D TARGET_DRONE_LORA_BRIDGE=1
;   -D DEMO_TEST_SENSOR_DATA=1
;
; build_src_filter =
;   ${env:esp32_base.build_src_filter}
;   +<drone_lora_bridge/>

; =========================================================
; Feather M0 LoRa firmware — node side (paired with a drone ESP32)
; Flash with NODE_ID=1 for the first node, NODE_ID=2 for the second, etc.
; To add a second node: duplicate this env and change NODE_ID.
; =========================================================
[env:lora_feather]
extends = env:feather_m0_base

build_flags =
  -D TARGET_LORA=1
  -D LORA_NODE=1
  -D NODE_ID=1

build_src_filter =
  ${env:feather_m0_base.build_src_filter}
  +<lora_feather/>

; =========================================================
; Feather M0 LoRa firmware — node 2
; =========================================================
[env:lora_feather_node2]
extends = env:feather_m0_base

build_flags =
  -D TARGET_LORA=1
  -D LORA_NODE=1
  -D NODE_ID=2

build_src_filter =
  ${env:feather_m0_base.build_src_filter}
  +<lora_feather/>

; =========================================================
; Feather M0 LoRa firmware — base station side (connects to Jetson)
; =========================================================
[env:lora_feather_base]
extends = env:feather_m0_base

build_flags =
  -D TARGET_LORA=1
  -D LORA_BASE_STATION=1

build_src_filter =
  ${env:feather_m0_base.build_src_filter}
  +<lora_feather/>

; =========================================================
; Optional legacy Uno environment
; =========================================================
[env:uno]
platform = atmelavr
board = uno
framework = arduino

lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library
  arduino-libraries/Servo

build_flags =
  -D TARGET_UNO=1

build_src_filter =
  +<shared/>
  +<uno/>
  -<drone/>
  -<drone_lora_bridge/>
  -<lora_feather/>
