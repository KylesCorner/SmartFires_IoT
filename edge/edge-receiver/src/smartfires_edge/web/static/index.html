<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SmartFires Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
</head>
<body>
  <main>
    <div class="layout">
      <section class="panel left-panel">
        <h1>Live Sensor Readings</h1>
        <div>
          <strong>Nodes</strong>
          <div id="node-checkboxes" class="checkbox-row"></div>
          <strong>Metrics</strong>
          <div id="metric-checkboxes" class="checkbox-row"></div>
        </div>
        <canvas id="sensor-chart" height="380"></canvas>
      </section>

      <section class="right-panel">
        <div class="panel">
          <h2>Node Map</h2>
          <div id="node-map"></div>
          <div class="base-station-form">
            <label>Base station:</label>
            <input id="base-lat" type="number" step="0.0000001" placeholder="lat" />
            <input id="base-lon" type="number" step="0.0000001" placeholder="lon" />
            <button id="base-save">Save</button>
          </div>
        </div>

        <div class="panel">
          <h2>Nodes</h2>
          <table id="node-table">
            <thead>
              <tr>
                <th>Node</th>
                <th>Lat</th>
                <th>Lon</th>
                <th>Batt %</th>
                <th>Last seen</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="panel log-panel">
      <div class="log-header">
        <h2>Live Log</h2>
        <div id="log-tabs" class="log-tabs"></div>
      </div>
      <pre id="log-output" class="log-output"></pre>
      <div class="log-command">
        <input id="cmd-input" type="text" placeholder="command…" autocomplete="off" />
        <button id="cmd-send">Send</button>
      </div>
    </div>
  </main>

  <script src="/static/vendor/chart.umd.js"></script>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/main_page.js"></script>
</body>
</html>
