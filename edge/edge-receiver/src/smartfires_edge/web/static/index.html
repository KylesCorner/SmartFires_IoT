<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SmartFires Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
</head>
<body>
  <main>
    <div class="layout">
      <section class="panel left-panel">
        <div class="log-header">
          <h1>Live Sensor Readings</h1>
          <button id="new-session-btn" class="new-session-btn">New Session</button>
        </div>
        <div>
          <strong>Nodes</strong>
          <div id="node-checkboxes" class="checkbox-row"></div>
          <strong>Metrics</strong>
          <div id="metric-checkboxes" class="checkbox-row"></div>
          <div class="sniffer-toolbar">
            <div class="sniffer-toolbar-group">
              <span class="sniffer-toolbar-label">Window:</span>
              <div id="time-range-buttons" class="time-range-row"></div>
            </div>
            <div class="sniffer-toolbar-group sniffer-playback">
              <button id="chart-step-back" class="sniffer-step-btn" title="Step back">◀</button>
              <button id="chart-play-toggle" class="sniffer-play-btn">⏸ Pause</button>
              <button id="chart-step-forward" class="sniffer-step-btn" title="Step forward">▶</button>
              <span id="chart-live-indicator" class="sniffer-live-indicator"></span>
            </div>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="sensor-chart"></canvas>
        </div>
        <div class="timeline-header">
          <h2>Session Timeline</h2>
          <span id="timeline-range" class="timeline-range"></span>
        </div>
        <div id="session-timeline" class="session-timeline"></div>
      </section>

      <section class="right-panel">
        <div class="panel">
          <h2>Node Map</h2>
          <div id="node-map"></div>
          <div class="base-station-form">
            <label>Base station:</label>
            <input id="base-lat" type="number" step="0.0000001" placeholder="lat" />
            <input id="base-lon" type="number" step="0.0000001" placeholder="lon" />
            <button id="base-save">Save</button>
          </div>
        </div>

        <div class="panel">
          <h2>Nodes</h2>
          <table id="node-table">
            <thead>
              <tr>
                <th>Node</th>
                <th>Serial</th>
                <th>Lat</th>
                <th>Lon</th>
                <th>Batt %</th>
                <th>Heading</th>
                <th>Heading Acc</th>
                <th>Last seen</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/vendor/chart.umd.js"></script>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/tile_layer.js"></script>
  <script src="/static/js/main_page.js"></script>
</body>
</html>
