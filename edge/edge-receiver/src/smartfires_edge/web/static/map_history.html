<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SmartFires — Link Quality</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
</head>
<body>
  <main>
    <div class="layout">

      <section class="panel left-panel">
        <h2>Signal Map</h2>
        <div id="history-map"></div>

        <h2 class="section-spacer">Reception Timeline</h2>
        <p class="section-hint">Each box is one seq number. Green = received, red = missing, grey = before session. Highest seq is on the right; data shifts left as new packets arrive.</p>
        <div id="reception-timeline"></div>
      </section>

      <section class="right-panel">
        <div class="panel">
          <h2>Link Quality</h2>
          <table id="loss-table">
            <thead>
              <tr>
                <th>Node</th>
                <th>Loss%</th>
                <th>Rcvd</th>
                <th>Miss</th>
                <th>Dup</th>
                <th>RSSI</th>
                <th>Retx</th>
                <th>Fail</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/map_history_page.js"></script>
</body>
</html>
