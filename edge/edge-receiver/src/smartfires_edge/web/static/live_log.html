<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SmartFires — Live Log</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <main>
    <div class="panel log-panel">
      <div class="log-header">
        <h2>Live Log</h2>
        <button id="log-clear-btn" class="new-session-btn">Clear</button>
      </div>
      <p class="section-hint">
        Streams every <code>[EDGE]</code>/<code>[RX]</code>/<code>[STATUS]</code>/<code>[SNIFFER-RX]</code>
        line as it's ingested. Pick a source to isolate one node or the passive sniffer, and a
        type to isolate periodic STATUS packets or per-sample BUNDLE telemetry.
      </p>
      <div class="log-header">
        <span class="sniffer-toolbar-label">Source:</span>
        <div id="log-source-tabs" class="log-tabs"></div>
      </div>
      <div class="log-header">
        <span class="sniffer-toolbar-label">Type:</span>
        <div id="log-kind-tabs" class="log-tabs"></div>
      </div>
      <pre id="log-output" class="log-output log-output-tall"></pre>
      <div class="log-command">
        <input id="cmd-input" type="text" placeholder="command…" autocomplete="off" />
        <button id="cmd-send">Send</button>
      </div>
    </div>
  </main>

  <script src="/static/js/nav.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/live_log_page.js"></script>
</body>
</html>
