; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; SmartFires unified PlatformIO configuration
; SmartFires unified PlatformIO configuration

[platformio]
default_envs = drone
description = Unified SmartFires project for Drone and LoRa targets

[env]
framework = arduino

; =========================================================
; Base environment: ESP32 / Arduino Nano ESP32
; =========================================================
[env:esp32_base]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
upload_speed = 115200
monitor_speed = 9600

lib_deps =
  SPI
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit Unified Sensor
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library
  arduino-libraries/Servo
  adafruit/Adafruit GPS Library
  olikraus/U8g2
  chris--a/Keypad

build_src_filter =
  +<shared/>
  -<drone/>
  -<drone_lora_bridge/>
  -<lora_feather/>
  -<uno/>

; =========================================================
; Base environment: Feather M0 LoRa board
; =========================================================
[env:feather_m0_base]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200

lib_deps =
  RadioHead

build_src_filter =
  +<shared/>
  -<drone/>
  -<drone_lora_bridge/>
  -<lora_feather/>
  -<uno/>

; =========================================================
; Main drone firmware (ESP32)
; =========================================================
[env:drone]
extends = env:esp32_base
extra_scripts = pre:extra_script.py

build_flags =
  -D TARGET_DRONE=1

build_src_filter =
  ${env:esp32_base.build_src_filter}
  +<drone/>

; =========================================================
; ESP32 <-> Feather UART bridge / telemetry firmware
; =========================================================
[env:drone_lora_bridge]
extends = env:esp32_base

build_flags =
  -D TARGET_DRONE_LORA_BRIDGE=1
  -D DEMO_TEST_SENSOR_DATA=1

build_src_filter =
  ${env:esp32_base.build_src_filter}
  +<drone_lora_bridge/>

; =========================================================
; Feather M0 LoRa firmware
; =========================================================
[env:lora_feather]
extends = env:feather_m0_base

build_flags =
  -D TARGET_LORA=1
  -D LORA_FEATHER_NODE=1
  -D LORA_UART_LINK=1

build_src_filter =
  ${env:feather_m0_base.build_src_filter}
  +<lora_feather/>

; =========================================================
; Optional legacy Uno environment
; =========================================================
[env:uno]
platform = atmelavr
board = uno
framework = arduino

lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library
  arduino-libraries/Servo

build_flags =
  -D TARGET_UNO=1

build_src_filter =
  +<shared/>
  +<uno/>
  -<drone/>
  -<drone_lora_bridge/>
  -<lora_feather/>
